name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Signed release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK Platform 36 + Build Tools
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(ls -d "${SDK}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          fi
          echo "Using ${SDKMANAGER}"
          (yes || true) | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=${SDK}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_ENV"
          ls "${SDK}/platforms" "${SDK}/build-tools"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/release.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
          if [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # local.properties is not committed; the integration keys come from repo secrets.
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          APPSFLYER_DEV_KEY: ${{ secrets.APPSFLYER_DEV_KEY }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature (fail on debug certificate)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "${APK}" ]; then echo "::error::Release APK not found"; exit 1; fi
          if ! "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "${APK}" > apksigner.txt 2>&1; then
            cat apksigner.txt
            echo "::error::apksigner verification FAILED"
            exit 1
          fi
          grep -E "Verified using|Signer #1 certificate DN" apksigner.txt || true
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::APK is signed with the Android DEBUG certificate"
            exit 1
          fi
          "${BUILD_TOOLS_DIR}/zipalign" -c -P 16 -v 4 "${APK}" > /dev/null
          echo "APK signature OK and 16 KB aligned: ${APK}"

      - name: Verify AAB signature (fail on debug certificate)
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          if [ -z "${AAB}" ]; then echo "::error::Release AAB not found"; exit 1; fi
          if ! jarsigner -verify -verbose:summary -certs "${AAB}" > jarsigner.txt 2>&1; then
            echo "::error::jarsigner verification of the AAB FAILED"
            exit 1
          fi
          if grep -q "CN=Android Debug" jarsigner.txt; then
            echo "::error::AAB is signed with the Android DEBUG certificate"
            exit 1
          fi
          grep -q "jar verified" jarsigner.txt || { echo "::error::AAB not verified"; exit 1; }
          echo "AAB signature OK: ${AAB}"

      - name: Upload APK (testing only - do NOT upload to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: arctic-fish-trail-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: arctic-fish-trail-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.p12" apksigner.txt jarsigner.txt
